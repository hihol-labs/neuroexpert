version: "3.9"

# =============================================================================
# НейроЭксперт — Production (Supabase self-hosted + Coolify Traefik)
# =============================================================================
# Запуск: docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
# =============================================================================

services:
  # ===== SUPABASE: PostgreSQL =====
  supabase-db:
    image: supabase/postgres:15.1.1.61
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
    volumes:
      - neuro-db-data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d
    networks:
      - neuro-internal
    restart: unless-stopped

  # ===== SUPABASE: PostgREST (REST API) =====
  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://authenticator:${SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    networks:
      - neuro-internal
    restart: unless-stopped

  # ===== SUPABASE: GoTrue (Auth) =====
  supabase-auth:
    image: supabase/gotrue:v2.151.0
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-https://supabase.neuroexpertise.ru}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: ${APP_URL:-https://neuroexpertise.ru}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-noreply@neuroexpertise.ru}
      GOTRUE_SMTP_MAX_FREQUENCY: "1ns"
      GOTRUE_MAILER_URLPATHS_INVITE: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_RECOVERY: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "/auth/v1/verify"
    networks:
      - neuro-internal
    restart: unless-stopped

  # ===== SUPABASE: Storage API =====
  supabase-storage:
    image: supabase/storage-api:v0.46.4
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    environment:
      ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgresql://supabase_storage_admin:${SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      IS_MULTITENANT: "false"
    volumes:
      - neuro-storage-data:/var/lib/storage
    networks:
      - neuro-internal
    restart: unless-stopped

  # ===== SUPABASE: Kong (API Gateway) =====
  supabase-kong:
    image: kong:3.5
    depends_on:
      supabase-rest:
        condition: service_started
      supabase-auth:
        condition: service_started
      supabase-storage:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - neuro-internal
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neuro-supabase.rule=Host(`supabase.neuroexpertise.ru`)"
      - "traefik.http.routers.neuro-supabase.entrypoints=https"
      - "traefik.http.routers.neuro-supabase.tls=true"
      - "traefik.http.routers.neuro-supabase.tls.certresolver=letsencrypt"
      - "traefik.http.services.neuro-supabase.loadbalancer.server.port=8000"
    restart: unless-stopped

  # ===== WEB (Next.js) =====
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    depends_on:
      supabase-kong:
        condition: service_started
    env_file: ../.env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    networks:
      - neuro-internal
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neuro-web.rule=Host(`neuroexpertise.ru`)"
      - "traefik.http.routers.neuro-web.entrypoints=https"
      - "traefik.http.routers.neuro-web.tls=true"
      - "traefik.http.routers.neuro-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.neuro-web.loadbalancer.server.port=3000"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.neuro-web-http.rule=Host(`neuroexpertise.ru`)"
      - "traefik.http.routers.neuro-web-http.entrypoints=http"
      - "traefik.http.routers.neuro-web-http.middlewares=neuro-https-redirect"
      - "traefik.http.middlewares.neuro-https-redirect.redirectscheme.scheme=https"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===== TELEGRAM BOT =====
  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    depends_on:
      supabase-kong:
        condition: service_started
    env_file: ../.env
    environment:
      - NODE_ENV=production
    networks:
      - neuro-internal
    restart: unless-stopped

  # ===== WORKER =====
  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    depends_on:
      supabase-kong:
        condition: service_started
    env_file: ../.env
    environment:
      - NODE_ENV=production
    networks:
      - neuro-internal
    restart: unless-stopped

volumes:
  neuro-db-data:
  neuro-storage-data:

networks:
  neuro-internal:
    driver: bridge
  coolify:
    external: true
